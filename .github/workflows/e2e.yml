name: E2E (self-hosted)

# The full 7-step browser E2E against the Cloudflare-protected dMoney app.
# GitHub's shared runners are blocked by Cloudflare, so this runs on a
# SELF-HOSTED runner (a trusted IP — the same environment where the suite
# passes locally). Register one under Settings → Actions → Runners,
# add the GMAIL_* secrets, then dispatch this workflow.
on:
  workflow_dispatch:

jobs:
  e2e:
    name: dMoney E2E (Chromium)
    timeout-minutes: 30
    runs-on: [self-hosted]

    env:
      BASE_URL: https://dmoneyportal.roadtocareer.net
      ADMIN_EMAIL: admin@dmoney.com
      ADMIN_PASSWORD: '1234'
      SYSTEM_EMAIL: system@dmoney.com
      SYSTEM_PASSWORD: '1234'
      AGENT_PASSWORD: '1234'
      SYSTEM_DEPOSIT_AMOUNT: '2000'
      CUSTOMER_DEPOSIT_AMOUNT: '500'
      EXISTING_CUSTOMER_PHONE: ${{ vars.EXISTING_CUSTOMER_PHONE }}
      GMAIL_BASE_LOCAL: ${{ secrets.GMAIL_BASE_LOCAL }}
      GMAIL_ACCESS_TOKEN: ${{ secrets.GMAIL_ACCESS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (Chromium)
        run: npx playwright install chromium

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30