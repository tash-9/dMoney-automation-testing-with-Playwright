name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# The app under test is behind Cloudflare bot-protection that blocks GitHub's
# shared runner IPs, so the browser E2E cannot execute on hosted runners. This
# hosted job therefore validates the project (install + typecheck + suite
# discovery). The full 7-step E2E runs from a trusted IP — locally via
# `npm test`, or in CI via the self-hosted workflow (.github/workflows/e2e.yml).
jobs:
  validate:
    name: Build · Typecheck · Suite wiring
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Install Playwright browser (Chromium)
        run: npx playwright install chromium

      - name: Verify the E2E suite is wired (lists all tests)
        run: npx playwright test --list