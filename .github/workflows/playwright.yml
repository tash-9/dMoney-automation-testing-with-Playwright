name: Playwright E2E

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: dMoney E2E (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      BASE_URL: https://dmoneyportal.roadtocareer.net
      ADMIN_EMAIL: admin@dmoney.com
      ADMIN_PASSWORD: '1234'
      SYSTEM_EMAIL: system@dmoney.com
      SYSTEM_PASSWORD: '1234'
      AGENT_PASSWORD: '1234'
      SYSTEM_DEPOSIT_AMOUNT: '2000'
      CUSTOMER_DEPOSIT_AMOUNT: '500'
      EXISTING_CUSTOMER_PHONE: ${{ vars.EXISTING_CUSTOMER_PHONE }}
      GMAIL_BASE_LOCAL: ${{ secrets.GMAIL_BASE_LOCAL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # A raw OAuth access token stored as a secret expires (~1hr) and then
      # every run fails with "Gmail API error: 401". Mint a fresh access
      # token from a long-lived refresh token right before the tests run
      # instead. Requires three new repo secrets: GMAIL_CLIENT_ID,
      # GMAIL_CLIENT_SECRET, GMAIL_REFRESH_TOKEN (see note below).
      - name: Refresh Gmail access token
        id: gmail_token
        run: |
          RESPONSE=$(curl -s -X POST https://oauth2.googleapis.com/token \
            -d client_id="${{ secrets.GMAIL_CLIENT_ID }}" \
            -d client_secret="${{ secrets.GMAIL_CLIENT_SECRET }}" \
            -d refresh_token="${{ secrets.GMAIL_REFRESH_TOKEN }}" \
            -d grant_type=refresh_token)

          ACCESS_TOKEN=$(echo "$RESPONSE" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).access_token')

          if [ -z "$ACCESS_TOKEN" ] || [ "$ACCESS_TOKEN" == "undefined" ]; then
            echo "::error::Failed to refresh Gmail access token: $RESPONSE"
            exit 1
          fi

          echo "::add-mask::$ACCESS_TOKEN"
          echo "GMAIL_ACCESS_TOKEN=$ACCESS_TOKEN" >> "$GITHUB_ENV"

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

# NOTE: if this app is behind bot-protection that blocks GitHub's shared
# runner IPs, the browser steps above will fail even though your local run
# passes. If that happens, you'll need a self-hosted runner (Settings →
# Actions → Runners) instead of `runs-on: ubuntu-latest` — check this early,
# don't wait until submission day.
#
# NOTE: to get GMAIL_REFRESH_TOKEN, run Google's OAuth Playground
# (https://developers.google.com/oauthplayground) once against the
# https://www.googleapis.com/auth/gmail.readonly scope using your own
# GMAIL_CLIENT_ID/GMAIL_CLIENT_SECRET (from Google Cloud Console), then
# copy the refresh token it returns into a repo secret. It doesn't expire
# unless revoked, so you only need to do this once.
